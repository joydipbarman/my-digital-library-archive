<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Digital Library</title>
  <meta name="description" content="A personal digital library and archive of books, papers and notes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div>
        <h1>My Digital Library</h1>
        <p class="tagline">A personal archive of books, papers and notes.</p>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="Search and filters">
      <input id="search" type="search" placeholder="Search title, author, tag…" autocomplete="off" aria-label="Search library">
      <select id="category" aria-label="Filter by category"></select>
      <select id="sort" aria-label="Sort books">
        <option value="title">Sort: Title A–Z</option>
        <option value="author">Sort: Author A–Z</option>
        <option value="year-desc">Sort: Newest first</option>
        <option value="year-asc">Sort: Oldest first</option>
        <option value="added">Sort: Recently added</option>
      </select>
      <div class="view-toggle" role="group" aria-label="View">
        <button id="viewGrid" class="active" aria-pressed="true">Grid</button>
        <button id="viewList" aria-pressed="false">List</button>
      </div>
    </section>

    <p id="count" class="count" aria-live="polite"></p>
    <section id="library" class="grid" aria-label="Books"></section>
    <p id="empty" class="empty" hidden>No books match your search.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Built with plain HTML, CSS and JavaScript · Hosted on GitHub Pages</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
